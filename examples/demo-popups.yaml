                            hold_action:
                              action: none
                            rules:
                              - when:
                                  entity: input_select.graph_day_month_year
                                  state: Month
                                entity: sensor.energy_generation_monthly
                              - when:
                                  entity: input_select.graph_day_month_year
                                  state: Year
                                entity: sensor.energy_generation_yearly
                      - type: custom:glass-divider
                        name: Solar and use
                        icon: mdi:home-lightning-bolt-outline
                        margin: 0
                        line: false
                      - type: custom:glass-chart
                        offset_entity: input_number.counter_graph
                        select_entity: input_select.graph_day_month_year
                        card:
                          type: custom:apexcharts-card
                          stacked: true
                          apex_config:
                            chart:
                              type: area
                        day:
                          update_interval: 15m
                          series:
                            - entity: sensor.total_load
                              name: Use
                              unit: kW
                              transform: return -x
                              type: column
                              group_by:
                                func: diff
                                start_with_last: true
                              opacity: 0.5
                            - entity: sensor.today_s_pv_generation
                              name: Solar
                              unit: kW
                              type: column
                              group_by:
                                func: diff
                                start_with_last: true
                        month:
                          update_interval: 1h
                          series:
                            - entity: sensor.pnd_data
                              name: Use
                              unit: kW
                              type: column
                              attribute: consumption
                              data_generator: |
                                return entity.attributes.pnddate.map((pnd, index) => {
                                  return [new Date(pnd).getTime(), Number(entity.attributes.consumption[index])];
                                });
                              invert: true
                              group_by:
                                func: sum
                              opacity: 0.5
                            - entity: sensor.pnd_data
                              name: Export
                              unit: kW
                              type: column
                              attribute: production
                              data_generator: |
                                return entity.attributes.pnddate.map((pnd, index) => {
                                  return [new Date(pnd).getTime(), Number(entity.attributes.production[index])];
                                });
                              group_by:
                                func: sum
                        year:
                          update_interval: 1h
                          series:
                            - entity: sensor.pnd_data
                              name: Use
                              unit: kW
                              type: column
                              attribute: consumption
                              data_generator: |
                                return entity.attributes.pnddate.map((pnd, index) => {
                                  return [new Date(pnd).getTime(), Number(entity.attributes.consumption[index])];
                                });
                              invert: true
                              group_by:
                                func: sum
                              opacity: 0.5
                            - entity: sensor.pnd_data
                              name: Export
                              unit: kW
                              type: column
                              attribute: production
                              data_generator: |
                                return entity.attributes.pnddate.map((pnd, index) => {
                                  return [new Date(pnd).getTime(), Number(entity.attributes.production[index])];
                                });
                              group_by:
                                func: sum
                          apex_config:
                            yaxis:
                              - labels:
                                  show: false
                                axisBorder:
                                  show: false
                                axisTicks:
                                  show: false
                        height: 200
                      - type: custom:glass-divider
                        name: Export to the grid
                        icon: mdi:transmission-tower-import
                        margin: 0
                        line: false
                      - type: custom:glass-chart
                        offset_entity: input_number.counter_graph
                        select_entity: input_select.graph_day_month_year
                        card:
                          type: custom:apexcharts-card
                          apex_config:
                            chart:
                              type: area
                          yaxis:
                            - decimals: 0
                        day:
                          series:
                            - entity: sensor.active_power
                              transform: return x/1000
                              unit: kW
                              type: column
                              group_by:
                                duration: 15m
                                func: max
                              name: Export
                          update_interval: 15m
                        month:
                          series:
                            - entity: sensor.pnd_data
                              unit: kW
                              type: column
                              attribute: production
                              data_generator: |
                                return entity.attributes.pnddate.map((pnd, index) => {
