# Glass Cards – the demo dashboard's pop-ups (Bubble Card), one section each.
# The demo dashboard loads them with overlay_source.
title: Glass demo – pop-ups
views:
  - title: Tablet
    path: tablet
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Navigation
          - type: custom:bubble-card
            card_type: horizontal-buttons-stack
            width_desktop: 620px
            auto_order: false
            is_sidebar_hidden: true
            highlight_current_view: true
            hide_gradient: true
            1_link: "#lights"
            1_name: ""
            1_icon: mdi:lightbulb-group
            2_link: "#blinds"
            2_name: ""
            2_icon: mdi:blinds-horizontal
            3_link: "#movies"
            3_name: ""
            3_icon: mdi:movie-play-outline
            4_link: "#media"
            4_name: ""
            4_icon: mdi:music
            5_link: "#weather"
            5_name: ""
            5_icon: mdi:weather-partly-cloudy
            6_link: "#energy"
            6_name: ""
            6_icon: mdi:solar-power-variant
            7_link: "#heating"
            7_name: ""
            7_icon: mdi:radiator
            8_link: "#security"
            8_name: ""
            8_icon: mdi:cctv
            9_link: "#cleaning"
            9_name: ""
            9_icon: mdi:broom
            styles: |2-
              
               .lights > .bubble-background-color, .blinds > .bubble-background-color, .media > .bubble-background-color, .movies > .bubble-background-color, .weather > .bubble-background-color, .energy > .bubble-background-color, .heating > .bubble-background-color, .security > .bubble-background-color, .cleaning > .bubble-background-color {
                background: var(--button-card-background) !important;
                border: 1px solid var(--button-card-border) !important;
                box-shadow:
                  0 10px 25px var(--button-card-shadow) !important,
                  inset 0 1px 1px var(--button-card-inset-shadow) !important;
                backdrop-filter: blur(35px) saturate(100%) !important;
                -webkit-backdrop-filter: blur(35px) saturate(100%) !important;
              }
               .lights > .bubble-background, .blinds > .bubble-background, .media > .bubble-background, .movies > .bubble-background, .weather > .bubble-background, .energy > .bubble-background, .heating > .bubble-background, .security > .bubble-background, .cleaning > .bubble-background {
                background: rgba(0,0,0,0) !important;
              }
              /* ikony */ .lights > .bubble-icon, .blinds > .bubble-icon, .media > .bubble-icon, .movies > .bubble-icon, .weather > .bubble-icon, .energy > .bubble-icon, .heating > .bubble-icon, .security > .bubble-icon, .cleaning > .bubble-icon {
                color: var(--button-card-icon) !important;
                filter: drop-shadow(0 2px 6px var(--button-card-icon-shadow)) !important;
                transition: color 0.3s ease !important;
              }
               .lights > .bubble-name, .blinds > .bubble-name, .media > .bubble-name, .movies > .bubble-name, .weather > .bubble-name, .energy > .bubble-name, .heating > .bubble-name, .security > .bubble-name, .cleaning > .bubble-name {
                color: var(--button-card-name) !important;
              }
               .bubble-button.highlight > .bubble-icon {
                color: var(--button-card-icon-active) !important;
                filter: drop-shadow(0 4px 4px var(--button-card-icon-shadow)) !important;
                animation: pulse 1.4s infinite alternate !important;
              }
               .bubble-button.highlight > .bubble-background-color {
                background: linear-gradient(
                  120deg,
                  var(--button-card-before-gradient-start),
                  var(--button-card-before-gradient-mid) 30%,
                  var(--button-card-before-gradient-end) 60%
                ) !important;
                box-shadow:
                  0 10px 25px var(--button-card-shadow) !important,
                  inset 0 1px 1px var(--button-card-inset-shadow) !important;
              }
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#heating"
            margin_top_desktop: -7%
            width_desktop: 1280px
            bg_blur: 90
            bg_opacity: 0
            is_sidebar_hidden: true
            auto_close: 60000
            icon: mdi:radiator
            name: Room heating
            hide_backdrop: true
            cards:
              - type: custom:glass-popup-header
                name: Room heating
                icon: mdi:radiator
              - type: custom:glass-panel
                glass: none
                layout: row
                gap: 22
                padding: 0 6px
                align: stretch
                height: 624px
                cards:
                  - type: custom:glass-panel
                    role: sidebar
                    gap: 26
                    padding: 22
                    view_layout:
                      grow: 0
                      shrink: 0
                      basis: max(340px, calc((100% - 22px) * 0.36 / 1.36))
                    cards:
                      - type: custom:glass-heat-pump
                        view_layout:
                          shrink: 0
                        entities:
                          climate: climate.heat_pump_heating
                          water_heater: water_heater.heat_pump_domestic_hot_water
                          compressor: binary_sensor.heat_pump_compressor
                          pump: binary_sensor.heat_pump_circulation_pump
                          frost: binary_sensor.heat_pump_frost_protection
                          phase: sensor.heat_pump_compressor_phase
                          outside: sensor.heat_pump_outside_temperature
                          supply: sensor.heat_pump_secondary_circuit_supply_temperature
                          return: sensor.heat_pump_return_temperature
                          dhw: sensor.hot_water_temperature
                          dhw_mode: select.heat_pump_dhw_operating_mode
                          curve_shift: number.heat_pump_heating_curve_shift
                          curve_slope: number.heat_pump_heating_curve_slope
                          compressor_starts: sensor.heat_pump_compressor_starts
                          compressor_hours: sensor.heat_pump_compressor_hours
                          rod_starts: sensor.heat_pump_heating_rod_starts
                          rod_hours: sensor.heat_pump_heating_rod_hours
                          pressure: sensor.heat_pump_supply_pressure
                          flow: sensor.heat_pump_volumetric_flow
                          dhw_active: sensor.water_heating_on
                          rod: binary_sensor.heat_pump_heating_rod
                        show_dhw_setpoint: false
                      - type: custom:glass-thermostat
                        entity: sensor.heat_pump_supply_temperature
                        name: Heating water
                        icon: mdi:radiator
                        hours: 12
                        graph_entities:
                          - sensor.heating_on
                        active:
                          entity: sensor.heating_on
                          state: on
                        view_layout:
                          grow: 1
                          basis: 80px
                        smoothing: 4
                        active_color: orange
                        inline_value: true
                      - type: custom:glass-thermostat
                        entity: sensor.current_water_temperature
                        name: Water temperature
                        icon: mdi:water-boiler
                        hours: 12
                        graph_entities:
                          - sensor.water_temperature
                        active:
                          entity: sensor.water_heating_on
                          state: on
                        view_layout:
                          grow: 1
                          basis: 80px
                        smoothing: 4
                        active_color: orange
                        inline_value: true
                  - type: custom:glass-panel
                    glass: none
                    layout: grid
                    columns: 3
                    rows: 3
                    gap: 16
                    padding: 0
                    view_layout:
                      grow: 1
                      basis: 0px
                    cards:
                      - type: custom:glass-thermostat
                        entity: climate.radiator_6
                        temperature_entity: sensor.room_temperature_4
                        name: Living room
                        icon: mdi:sofa
                        hours: 24
                      - type: custom:glass-thermostat
                        entity: climate.radiator_5
                        temperature_entity: sensor.room_temperature_4
                        name: Kitchen
                        icon: mdi:silverware-fork-knife
                        hours: 24
                      - type: custom:glass-thermostat
                        entity: climate.radiator
                        temperature_entity: sensor.room_temperature
                        name: Office
                        icon: mdi:chair-rolling
                        hours: 24
                      - type: custom:glass-thermostat
                        entity: climate.radiator_7
                        temperature_entity: sensor.room_temperature_3
                        name: Bedroom
                        icon: mdi:bed-queen
                        hours: 24
                      - type: custom:glass-thermostat
                        entity: climate.radiator_4
                        name: Kids' room
                        icon: mdi:teddy-bear
                        hours: 24
                        temperature_entity: sensor.radiator_current_temperature_4
                      - type: custom:glass-thermostat
                        entity: climate.radiator_3
                        temperature_entity: sensor.room_temperature_2
                        name: Hallway
                        icon: mdi:hanger
                        hours: 24
                      - type: custom:glass-thermostat
                        entity: climate.radiator_2
                        name: Toilet
                        icon: mdi:toilet
                        hours: 24
                        temperature_entity: sensor.radiator_current_temperature_2
                      - type: custom:glass-thermostat
                        entity: sensor.heat_pump_outside_temperature
                        name: Outside
                        icon: mdi:bench-back
                        hours: 48
                        view_layout:
                          span: 2
                        min_max: 24
            show_header: false
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#lights"
            margin_top_desktop: -7%
            width_desktop: 1280px
            bg_blur: 90
            bg_opacity: 0
            is_sidebar_hidden: true
            auto_close: 60000
            icon: mdi:lightbulb-group
            name: Lights
            hide_backdrop: true
            cards:
              - type: custom:glass-popup-header
                name: Lights
                icon: mdi:lightbulb-group
                buttons:
                  - name: All on
                    icon: mdi:lightbulb-group
                    tap_action:
                      action: perform-action
                      perform_action: homeassistant.turn_on
                      target:
                        entity_id:
                          - light.living_room
                          - light.kitchen
                          - light.kitchen_led
                          - light.hallway
                          - switch.wall_switch
                          - switch.wall_switch_2
                          - switch.switch
                          - switch.switch_switch1
                          - switch.switch_switch2
                          - light.hub_light
                  - name: All off
                    icon: mdi:lightbulb-group-off
                    tap_action:
                      action: perform-action
                      perform_action: homeassistant.turn_off
                      target:
                        entity_id:
                          - light.living_room
                          - light.kitchen
                          - light.kitchen_led
                          - light.hallway
                          - switch.wall_switch
                          - switch.wall_switch_2
                          - switch.switch
                          - switch.switch_switch1
                          - switch.switch_switch2
                          - light.hub_light
              - type: custom:glass-panel
                glass: none
                layout: row
                gap: 22
                padding: 0 6px
                align: stretch
                height: 624px
                cards:
                  - type: custom:glass-panel
                    role: sidebar
                    layout: column
                    gap: 18
                    padding: 22
                    justify: space-between
                    view_layout:
                      grow: 0
                      shrink: 0
                      basis: max(340px, calc((100% - 22px) * 0.36 / 1.36))
                    cards:
                      - type: custom:glass-status-bar
                        layout: pills
                        columns: 1
                        items:
                          - entity: automation.living_room_lights_by_daylight
                            icon: mdi:brightness-auto
                            name: Living room by daylight
                            text: Off
                            tap_action:
                              action: perform-action
                              perform_action: automation.toggle
                              target:
                                entity_id:
                                  - automation.living_room_lights_by_daylight
                                  - automation.living_room_ligts_luminance_day_on_bright
                                  - automation.living_room_ligts_luminance_dusk_on
                                  - automation.living_room_ligts_luminance_day_off
                                  - automation.living_room_ligts_luminance_night_nightlight
                                  - automation.living_room_ligts_luminance_night_off
                                  - automation.living_room_lights_off_by_sensor
                            rules:
                              - state: on
                                text: On
                                icon_color: orange
                          - entity: automation.living_room_circadian
                            icon: mdi:sun-clock-outline
                            name: Living room – circadian
                            text: Off
                            tap_action:
                              action: toggle
                            rules:
                              - state: on
                                text: On
                                icon_color: orange
                          - entity: automation.netflix_playing_living_room
                            icon: mdi:television-play
                            name: Living room during TV
                            text: Off
                            tap_action:
                              action: toggle
                            rules:
                              - state: on
                                text: On
                                icon_color: orange
                          - entity: automation.turn_wled_kitchen_presence_on
                            icon: mdi:account-arrow-right
                            name: Counter by presence
                            text: Off
                            tap_action:
                              action: perform-action
                              perform_action: automation.toggle
                              target:
                                entity_id:
                                  - automation.turn_wled_kitchen_presence_on
                                  - automation.turn_wled_kitchen_presence_off
                            rules:
                              - state: on
                                text: On
                                icon_color: orange
                          - entity: automation.lights_kitchen_wled_water_temperature
                            icon: mdi:water-thermometer-outline
                            name: Counter – water temperature
                            text: Off
                            tap_action:
                              action: toggle
                            rules:
                              - state: on
                                text: On
                                icon_color: orange
                          - entity: automation.hallway_night_light
                            icon: mdi:weather-night
                            name: Hallway – night light
                            text: Off
                            tap_action:
                              action: toggle
                            rules:
                              - state: on
                                text: On
                                icon_color: orange
                          - entity: automation.toilet_light_by_motion
                            icon: mdi:motion-sensor
                            name: Toilet by motion
                            text: Off
                            tap_action:
                              action: toggle
                            rules:
                              - state: on
                                text: On
                                icon_color: orange
                          - entity: automation.lights_bathroom
                            icon: mdi:motion-sensor
                            name: Bathroom by motion
                            text: Off
                            tap_action:
                              action: toggle
                            rules:
                              - state: on
                                text: On
                                icon_color: orange
                          - entity: automation.kids_star_projector
                            icon: mdi:clock-star-four-points-outline
                            name: Projector on a timer
                            text: Off
                            tap_action:
                              action: toggle
                            rules:
                              - state: on
                                text: On
                                icon_color: orange
                          - entity: automation.garden_lights_at_the_entrance
                            icon: mdi:walk
                            name: Garden by the entrance
                            text: Off
                            tap_action:
                              action: toggle
                            rules:
                              - state: on
                                text: On
                                icon_color: orange
                        view_layout:
                          grow: 1
                        gap: 6
                        styles:
                          pill_height: 44px
                        detail: last_triggered
                  - type: custom:glass-panel
                    glass: none
                    layout: column
                    gap: 16
                    padding: 0
                    view_layout:
                      grow: 1
                      basis: 0px
                    cards:
                      - type: custom:glass-panel
                        glass: none
                        layout: grid
                        columns: 3
                        gap: 16
                        padding: 0
                        view_layout:
                          shrink: 0
                          height: auto
                        cards:
                          - type: custom:glass-light
                            name: Living room
                            lights:
                              - entity: light.living_room
                                name: Sofa
                                levels:
                                  - 25
                                  - 50
                                  - 75
                                  - 100
                                scenes:
                                  - entity: scene.living_room_relax
                                    name: Relax
                                    image: glass:demo/scene-relax.png
                                  - entity: scene.living_room_concentrate
                                    name: Focus
                                    image: glass:demo/scene-concentrate.png
                                  - entity: scene.living_room_read
                                    name: Read
                                    image: glass:demo/scene-read.png
                                  - entity: scene.living_room_nightlight
                                    name: Night
                                    image: glass:demo/scene-night.png
                                  - entity: scene.living_room_natural_light
                                    name: Natural
                                    image: glass:demo/scene-natural.png
                          - type: custom:glass-light
                            name: Kitchen
                            lights:
                              - entity: light.kitchen
                                name: Bar
                                levels:
                                  - 25
                                  - 50
                                  - 75
                                  - 100
                                scenes:
                                  - entity: scene.kitchen_relax
                                    name: Relax
                                    image: glass:demo/scene-relax.png
                                  - entity: scene.kitchen_concentrate
                                    name: Focus
                                    image: glass:demo/scene-concentrate.png
                                  - entity: scene.kitchen_read
                                    name: Read
                                    image: glass:demo/scene-read.png
                                  - entity: scene.kitchen_nightlight
                                    name: Night
                                    image: glass:demo/scene-night.png
                                  - entity: scene.kitchen_natural_light
                                    name: Natural
                                    image: glass:demo/scene-natural.png
                              - entity: light.kitchen_led
                                name: Counter LED
                                presets: select.kitchen_led_preset
                                preset_options:
                                  - option: Upper light
                                    name: Upper
                                    icon: mdi:light-flood-up
                                  - option: Lower light
                                    name: Lower
                                    icon: mdi:light-flood-down
                                  - option: All lights
                                    name: All
                                    icon: mdi:led-strip-variant
                          - type: custom:glass-light
                            name: Hallway
                            lights:
                              - entity: light.hallway
                                name: Ceiling
                                levels:
                                  - 25
                                  - 50
                                  - 75
                                  - 100
                                scenes:
                                  - entity: scene.hallway_relax
                                    name: Relax
                                    image: glass:demo/scene-relax.png
                                  - entity: scene.hallway_concentrate
                                    name: Focus
                                    image: glass:demo/scene-concentrate.png
                                  - entity: scene.hallway_read
                                    name: Read
                                    image: glass:demo/scene-read.png
                                  - entity: scene.hallway_nightlight
                                    name: Night
                                    image: glass:demo/scene-night.png
                                  - entity: scene.hallway_natural_light
                                    name: Natural
                                    image: glass:demo/scene-natural.png
                              - entity: light.hub_light
                                name: Hub
                                icon: mdi:lightbulb-night-outline
                          - type: custom:glass-light
                            name: Kids' room
                            lights:
                              - entity: input_boolean.star_projector
                                name: Star projector
                                icon: mdi:star-shooting-outline
                          - type: custom:glass-light
                            name: Bathroom
                            lights:
                              - entity: switch.switch
                                entities:
                                  - switch.switch
                                  - switch.switch_switch1
                                  - switch.switch_switch2
                                name: Lights
                                icon: mdi:ceiling-light
                          - type: custom:glass-light
                            name: Toilet
                            lights:
                              - entity: switch.wall_switch
                                name: Ceiling
                                icon: mdi:ceiling-light
                          - type: custom:glass-light
                            name: Laundry
                            lights:
                              - entity: switch.wall_switch_2
                                name: Ceiling
                                icon: mdi:ceiling-light
                          - type: custom:glass-light
                            name: Garden
                            lights:
                              - entity: light.garden_front
                                name: Path lights
                        equal_rows: false
                        masonry: true
                    justify: start
            show_header: false
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#blinds"
            margin_top_desktop: -7%
            width_desktop: 1120px
            bg_blur: 90
            bg_opacity: 0
            is_sidebar_hidden: true
            auto_close: 60000
            hide_backdrop: true
            icon: mdi:blinds-horizontal
            name: Blinds
            cards:
              - type: custom:glass-popup-header
                name: Blinds
                icon: mdi:blinds-horizontal
                buttons:
                  - name: All up
                    icon: mdi:arrow-collapse-up
                    confirm: true
                    tap_action:
                      action: perform-action
                      perform_action: cover.open_cover
                      target:
                        entity_id:
                          - cover.office
                          - cover.kids_room
                          - cover.balcony
                  - name: All down
                    icon: mdi:arrow-collapse-down
                    confirm: true
                    tap_action:
                      action: perform-action
                      perform_action: cover.close_cover
                      target:
                        entity_id:
                          - cover.office
                          - cover.kids_room
                          - cover.balcony
              - type: custom:glass-panel
                glass: none
                layout: row
                gap: 22
                padding: 0 6px
                align: stretch
                cards:
                  - type: custom:glass-panel
                    role: sidebar
                    gap: 20
                    padding: 22
                    view_layout:
                      grow: 0
                      shrink: 0
                      basis: max(340px, calc((100% - 22px) * 0.36 / 1.36))
                    cards:
                      - type: custom:glass-automation
                        entity: automation.blinds_auto
                        title: Blinds automation
                        pause_for: input_select.blinds_auto_pause
                        resume_at: input_datetime.blinds_auto_resume
                        pause_until: input_datetime.blinds_auto_until
                      - type: custom:glass-sun-shading
                        sun: sun.sun
                        light: sensor.sun_sensor_luminance
                        shading: sensor.blinds_shading_level
                        target_tilt: sensor.blinds_target_tilt
                        horizon: 4
                        azimuth_from: 195
                        azimuth_to: 305
                        azimuth_high_from: 215
                        azimuth_high_to: 305
                        azimuth_high_above: 20
                      - type: custom:glass-value-grid
                        title: Slat tilt
                        columns:
                          - name: Strong sun
                            icon: mdi:white-balance-sunny
                            months_from: input_number.blinds_summer_from
                            months_to: input_number.blinds_summer_to
                          - name: Weak sun
                            icon: mdi:weather-sunny-off
                        rows:
                          - name: Min
                            entities:
                              - input_number.blinds_summer_min
                              - input_number.blinds_winter_min
                          - name: Mid
                            entities:
                              - input_number.blinds_summer_medium
                              - input_number.blinds_winter_medium
                          - name: Max
                            entities:
                              - input_number.blinds_summer_max
                              - input_number.blinds_winter_max
                  - type: custom:glass-panel
                    glass: none
                    layout: grid
                    columns: 3
                    gap: 16
                    padding: 0
                    equal_rows: false
                    view_layout:
                      grow: 1
                      basis: 0px
                    cards:
                      - type: custom:glass-blind
                        entity: cover.office
                        name: Office
                        icon: mdi:desk
                        pause: switch.office_blinds_user_switch
                        pause_duration: 3600
                        positions:
                          - name: Up
                            icon: mdi:chevron-up
                            script: script.open_blinds_office
                          - name: Down
                            icon: mdi:chevron-down
                            script: script.close_blinds_office
                        tilts:
                          - name: Min
                            script: script.tilt_blinds_office_min
                          - name: Mid
                            script: script.tilt_blinds_office_mid
                          - name: Max
                            script: script.tilt_blinds_office_max
                        view_layout:
                          align: start
                      - type: custom:glass-blind
                        entity: cover.kids_room
                        name: Kids' room
                        icon: mdi:teddy-bear
                        pause: switch.kids_blinds_user_switch
                        pause_duration: 3600
                        positions:
                          - name: Up
                            icon: mdi:chevron-up
                            script: script.open_blinds_kids
                          - name: Down
                            icon: mdi:chevron-down
                            script: script.close_blinds_kids
                        tilts:
                          - name: Min
                            script: script.tilt_blinds_kids_min
                          - name: Mid
                            script: script.tilt_blinds_kids_mid
                          - name: Max
                            script: script.tilt_blinds_kids_max
                        view_layout:
                          align: start
                      - type: custom:glass-blind
                        entity: cover.balcony
                        name: Bedroom
                        icon: mdi:bed
                        pause: switch.bedroom_blinds_user_switch
                        pause_duration: 3600
                        positions:
                          - name: Up
                            icon: mdi:chevron-up
                            script: script.open_blinds_bedroom
                          - name: Down
                            icon: mdi:chevron-down
                            script: script.close_blinds_bedroom
                        tilts:
                          - name: Min
                            script: script.tilt_blinds_bedroom_min
                          - name: Mid
                            script: script.tilt_blinds_bedroom_mid
                          - name: Max
                            script: script.tilt_blinds_bedroom_max
                        view_layout:
                          align: start
                    align: start
            show_header: false
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#cleaning"
            margin_top_desktop: -7%
            width_desktop: 1280px
            bg_blur: 90
            bg_opacity: 0
            is_sidebar_hidden: true
            auto_close: 60000
            icon: mdi:broom
            name: Cleaning
            hide_backdrop: true
            cards:
