name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- dist
      # the cards with their wallpapers and the demo's pictures, unpacked by HACS into one folder
      - run: npm run release:zip
      - name: Release notes from the tag
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: notes.md
          files: glass-cards.zip
